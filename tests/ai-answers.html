<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>v4 AI 解答模擬測試</title><style>body{font-family:sans-serif;margin:20px}iframe{width:100%;height:1100px;border:1px solid #ccc}#status{white-space:pre-wrap}</style><h1>AI 解答與字體縮放測試（不呼叫付費 API）</h1><p id="status">準備測試…</p><iframe id="app" src="../v4/index.html" title="測試練習簿"></iframe><script>
const frame=document.querySelector('#app'),status=document.querySelector('#status');
frame.addEventListener('load',async()=>{
 try{
 const app=frame.contentWindow,doc=app.document;
 app.applyTextToCell(0,'一盒彩色筆有 12 枝，3 盒共有多少枝？');
 app.applyTextToCell(1,'已有解答的題目');app.applyTextToAnswer(1,'原有解答請保留');
 const module=doc.querySelector('#mathJsonFrame');
 await new Promise(resolve=>{module.addEventListener('load',resolve,{once:true});module.src=new URL('mock-answer-module.html',location.href).href;});
 const done=new Promise((resolve,reject)=>{
  const deadline=Date.now()+10000;
  const timer=setInterval(()=>{if(!doc.querySelector('#aiAnswerButton').disabled){clearInterval(timer);resolve();}else if(Date.now()>deadline){clearInterval(timer);reject(Error('填入逾時'));}},30);
 });
 doc.querySelector('#aiAnswerButton').click();await done;
 await doc.fonts.ready;await new Promise(resolve=>setTimeout(resolve,150));app.refreshQuestionTextSizing();
 const first=doc.querySelectorAll('.work-answer-content')[0],text=first.querySelector('.work-answer-text');
 if(!text?.textContent.includes('36'))throw Error('AI 回覆沒有寫入右側');
 if(first.scrollHeight>first.clientHeight+1||text.scrollWidth>first.clientWidth+1)throw Error('解答外溢');
 if(parseFloat(text.style.fontSize)<3)throw Error('字體縮得過小，可能有固定邊距阻擋縮放');
 if(!first.querySelector('.katex'))throw Error('公式沒有渲染');
 if(!doc.querySelectorAll('.work-answer-content')[1].textContent.includes('原有解答請保留'))throw Error('既有解答被覆蓋');
 // 轉換期間更新題目，舊解答不可回填。
 app.applyTextToCell(2,'等待回覆的舊題目');
 doc.querySelector('#aiAnswerButton').click();
 setTimeout(()=>app.applyTextToCell(2,'修改後的新題目'),30);
 await new Promise(resolve=>setTimeout(resolve,600));
 if(doc.querySelectorAll('.work-answer-content')[2].textContent.trim())throw Error('過期解答覆蓋了新題目');
 status.textContent='通過：模擬 AI 解答已填入對應格、既有解答保留、公式正確渲染、長解答自動縮放無外溢、修改題目後不套用舊回覆。字體：'+text.style.fontSize;
 }catch(error){status.textContent='失敗：'+error.message;}
});
</script></html>
