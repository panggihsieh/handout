<!doctype html><meta charset="utf-8"><script>
addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='handout-solve')return;
 const answer='先列式，再驗算。\n\n'+Array(18).fill('計算：\\(12 \\times 3 = 36\\)。所以答案是 **36 枝**。').join('\n\n');
 setTimeout(()=>event.source.postMessage({type:'handout-solved',id:event.data.id,result:{status:'solved',answer}},event.origin),100);
});
</script>
