<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latex數學-圖文練習簿 v4</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css?v=20261103-json-prompt">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="version-pill">版本:第4版 Math's Scrapbook v.4.0 (JSON/SVG/LaTeX 渲染測試版)｜最後修正：2026/11/03</p>
        <h1>Latex數學-圖文練習簿</h1>
        <p class="subtitle">A4 數學練習單，支援文字、圖片，以及 JSON 中的 SVG 圖形與 LaTeX 公式。</p>
      </div>
      <div class="hero-actions">
        <button id="resetButton" class="toggle-button secondary-button hero-reset-button" type="button">重設預設值</button>
        <button id="printButton" class="primary-button" type="button">列印 / 另存 PDF</button>
      </div>
    </header>

    <section class="controls" aria-label="設定">
      <label class="field">
        <span>標題</span>
        <input id="titleInput" type="text" value="梅山鄉大南國小">
      </label>

      <label class="field field-hidden" aria-hidden="true">
        <span>班級</span>
        <input id="classInput" type="text" value="" tabindex="-1" autocomplete="off">
      </label>

      <label class="field">
        <span>姓名</span>
        <input id="nameInput" type="text" value="" placeholder="請輸入學生姓名">
      </label>

      <label class="field">
        <span>日期</span>
        <input id="dateInput" type="date">
      </label>

      <label class="field">
        <span>起始編號</span>
        <input id="startNumberInput" type="number" min="1" value="1">
      </label>

      <label class="field">
        <span>頁數</span>
        <input id="pageCountInput" type="number" min="1" max="100" value="1">
      </label>

      <label class="field">
        <span>列數</span>
        <input id="rowCountInput" type="number" min="1" max="12" value="4">
      </label>

      <div class="field">
        <span>字體大小</span>
        <div class="stepper-control" aria-label="字體大小控制">
          <button id="fontScaleDownButton" class="stepper-button" type="button" aria-label="縮小字體">-</button>
          <button id="fontScaleUpButton" class="stepper-button" type="button" aria-label="放大字體">+</button>
        </div>
      </div>


      <label class="field field-toggle">
        <span>家長簽名</span>
        <button id="signatureToggle" class="toggle-button" type="button" aria-pressed="true">on</button>
      </label>

      <div class="field field-toggle">
        <span>左右皆為題目</span>
        <button id="twoQuestionToggle" class="toggle-button" type="button" aria-pressed="false">off</button>
      </div>

      <div class="field field-toggle answer-mode-field">
        <span>計算程序區解答</span>
        <button id="answerToggle" class="toggle-button" type="button" aria-pressed="false">學生版：隱藏</button>
      </div>

      <div class="field field-wide helper-card">
        <span>輸入方式</span>
        <p class="helper-text">每格可選「插入截圖」、「貼上文字」或「JSON」。文字支援 LaTeX 與 Markdown；JSON 可組合題文、公式與 SVG 圖形。列印時隱藏操作按鈕，透過 + / - 調整大小。</p>
        <div class="json-prompt">
          <button class="json-prompt-trigger" type="button" aria-expanded="false" aria-controls="jsonPromptPanel">JSON 提示詞</button>
          <div id="jsonPromptPanel" class="json-prompt-panel">
            <div class="json-prompt-heading">
              <strong>複製給 ChatGPT 的提示詞</strong>
              <button id="copyJsonPromptButton" type="button">複製提示詞</button>
              <span id="jsonPromptCopyStatus" role="status"></span>
            </div>
            <textarea id="jsonPromptText" readonly aria-label="JSON 生成提示詞" spellcheck="false">請將題目轉成我的練習簿 Web App 支援的 JSON。

格式規則：
1. 最外層使用 {"blocks": [...]}。
2. 每個區塊只能使用以下格式：
   題文：{"type":"text","value":"題目文字"}
   公式：{"type":"latex","value":"LaTeX 公式"}
   附圖：{"type":"svg","value":"完整 SVG 原始碼"}
3. 每個 value 必須是非空字串。
4. LaTeX 區塊只放公式本體，不加 $、$$、\( 或 \[ 外框。
5. 遵守 JSON 跳脫規則：LaTeX 的反斜線寫成 \\；SVG 屬性中的雙引號寫成 \"。
6. SVG 必須包含 xmlns 與 viewBox，僅使用內嵌圖形，不使用 script、外部圖片或外部資源。
7. 不使用 question、answer、solution 等自訂欄位；不要將答案或解法放入題目。
8. 保留原題的數字、單位、條件與所求；附圖以題文、標示數字與明確幾何記號為依據，不依外觀比例推定關係。
9. 若要求生成類題，先依要求合理換數字並驗算，再使用自然且不同的句型改寫；文字調整時不得再改變已驗算的數字、條件與結果。
10. 輸出前檢查 JSON 語法與數學內容。
11. 只輸出 JSON 原文，不加 Markdown 程式碼框或任何說明，讓我可以直接複製貼上。

格式範例：
{"blocks":[{"type":"text","value":"長方形的長是 8 公分，寬是 5 公分，求面積。"},{"type":"latex","value":"A = 8 \\times 5 = \\underline{\\qquad}"}]}

以下是要轉換的題目：
【在這裡貼上題目或附上圖片】</textarea>
          </div>
        </div>
      </div>

    </section>

    <main id="pages" class="pages guide-cross show-signature" aria-live="polite"></main>
  </div>

  <template id="pageTemplate">
    <section class="page">
      <div class="page-header">
        <div class="page-heading">
          <h2 class="page-title"></h2>
          <div class="page-info">
            <div class="page-info-item">版型：<span class="page-layout"></span></div>
            <div class="page-info-item">姓名：<span class="page-name"></span></div>
            <div class="page-info-item">日期：<span class="page-date"></span></div>
          </div>
        </div>
        <div class="page-signature">
          <span class="signature-label">
            <span>家長</span>
            <span>簽名</span>
          </span>
          <span class="signature-box" aria-hidden="true"></span>
        </div>
      </div>
      <div class="grid"></div>
      <div class="page-meta"></div>
    </section>
  </template>

  <template id="cellTemplate">
    <article class="cell">
      <div class="cell-layout">
        <section class="question-pane">
          <div class="cell-number"></div>
          <div class="cell-toolbar">
            <button class="cell-image-paste-button" type="button" aria-label="插入截圖" title="插入截圖">
              <span class="button-icon button-icon-image" aria-hidden="true"></span>
              <span>插入截圖</span>
            </button>
            <button class="cell-text-paste-button" type="button" aria-label="貼上文字" title="貼上文字">
              <span class="button-icon button-icon-text" aria-hidden="true"></span>
              <span>貼上文字</span>
            </button>
            <button class="cell-json-paste-button" type="button" aria-label="貼上 JSON 題目" title="貼上 JSON 題目">JSON</button>
            <div class="cell-font-stepper" aria-label="題目文字或圖片大小調整">
              <button class="cell-font-decrease-button" type="button" aria-label="縮小題目文字或圖片">-</button>
              <button class="cell-font-increase-button" type="button" aria-label="放大題目文字或圖片">+</button>
            </div>
            <button class="cell-clear-button" type="button" aria-label="清除題目" title="清除題目">清除</button>
          </div>
          <div class="cell-content"></div>
        </section>
        <section class="work-pane">
          <div class="work-pane-number"></div>
          <div class="work-pane-title">計算程序區</div>
          <div class="work-pane-body">
            <div class="work-answer-toolbar">
              <button class="answer-image-paste-button" type="button">
                <span class="button-icon button-icon-image" aria-hidden="true"></span>
                <span>插入截圖</span>
              </button>
              <button class="answer-text-paste-button" type="button">
                <span class="button-icon button-icon-text" aria-hidden="true"></span>
                <span>貼上文字</span>
              </button>
              <button class="answer-clear-button" type="button">清除</button>
            </div>
            <div class="work-answer-content"></div>
          </div>
        </section>
      </div>

    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="app.js?v=20261103-json-prompt"></script>
</body>
</html>
