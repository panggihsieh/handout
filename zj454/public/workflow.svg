<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc">
<title id="title">題目、JSON 與渲染預覽操作流程</title><desc id="desc">第一步貼上題目文字或截圖；按 AI 轉換，第二步產生 JSON；編輯 JSON 停頓後，第三步自動渲染 SVG 與 KaTeX。原始題目改動後需重新轉換，JSON 錯誤時會保留並標示舊預覽。</desc>
<rect width="1080" height="220" rx="14" fill="#ffffff"/>
<g font-family="Microsoft JhengHei, sans-serif">
<text x="24" y="30" fill="#1e293b" font-size="20" font-weight="700">操作流程</text>
<g transform="translate(24 50)"><rect width="260" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd"/><circle cx="30" cy="30" r="17" fill="#2563a1"/><text x="30" y="36" text-anchor="middle" fill="white" font-size="18">1</text><text x="58" y="36" fill="#1e293b" font-size="20" font-weight="700">輸入原始題目</text><path d="M22 56 H49 V91 H22 Z M28 65 H43 M28 73 H43 M28 81 H39" fill="none" stroke="#2563a1" stroke-width="2"/><text x="60" y="72" font-size="16" fill="#334155">貼上文字或截圖</text><text x="60" y="96" font-size="14" fill="#475569">修改後需重新轉換</text></g>
<g fill="#9a3412" font-size="14" text-anchor="middle"><text x="340" y="88">按 AI 轉換</text><text x="340" y="135">使用 API・可能計費</text></g><path d="M300 106 H374 M366 98 L376 106 L366 114" fill="none" stroke="#d97706" stroke-width="3"/>
<g transform="translate(394 50)"><rect width="260" height="110" rx="12" fill="#fff7ed" stroke="#fdba74"/><circle cx="30" cy="30" r="17" fill="#9a3412"/><text x="30" y="36" text-anchor="middle" fill="white" font-size="18">2</text><text x="58" y="36" fill="#1e293b" font-size="20" font-weight="700">產生／編輯 JSON</text><text x="20" y="85" fill="#9a3412" font-size="27">{ }</text><text x="72" y="72" font-size="16" fill="#334155">核對題文與圖形資料</text><text x="72" y="96" font-size="14" fill="#475569">亦可直接貼入 JSON</text></g>
<g fill="#1d4f81" font-size="14" text-anchor="middle"><text x="710" y="88">停頓後自動更新</text><text x="710" y="135">本機渲染・不呼叫 API</text></g><path d="M670 106 H744 M736 98 L746 106 L736 114" fill="none" stroke="#2563a1" stroke-width="3"/>
<g transform="translate(764 50)"><rect width="292" height="110" rx="12" fill="#f0fdf4" stroke="#86efac"/><circle cx="30" cy="30" r="17" fill="#166534"/><text x="30" y="36" text-anchor="middle" fill="white" font-size="18">3</text><text x="58" y="36" fill="#1e293b" font-size="20" font-weight="700">確認渲染預覽</text><path d="M21 60 H51 V86 H21 Z M24 82 L32 72 L39 79 L45 69" fill="none" stroke="#166534" stroke-width="2"/><text x="68" y="72" font-size="16" fill="#334155">檢查 SVG 與 KaTeX 公式</text><text x="68" y="96" font-size="14" fill="#475569">可彈跳預覽、複製 JSON</text></g>
<text x="24" y="194" font-size="15" fill="#475569">JSON 格式錯誤時保留舊預覽並顯示提示；載入測試題會同步更新 ①②③。</text>
</g></svg>